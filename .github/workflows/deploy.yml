name: Deploy to Timeweb VPS

on:
  workflow_dispatch:

concurrency:
  group: timeweb-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.TIMEWEB_DEPLOY_HOST }}
          username: ${{ secrets.TIMEWEB_DEPLOY_USER }}
          key: ${{ secrets.TIMEWEB_DEPLOY_SSH_KEY }}
          passphrase: ${{ secrets.TIMEWEB_DEPLOY_PASSPHRASE }}
          script: bash /var/www/fightnexus/deploy.sh
